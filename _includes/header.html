{%- comment -%}
  The same header on every page: the site title and the menu
  (_includes/menu.html), two text links. The contact icons are on the About page.
{%- endcomment -%}
<header>
  <div class="title-row">
    <div class="brand">
      {%- if include.home -%}
        <h1 class="site-title">{{ site.title }}</h1>
      {%- else -%}
        <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title }}</a>
      {%- endif -%}
    </div>
    {%-include menu.html-%}
  </div>
</header>
