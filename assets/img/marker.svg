<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 40" preserveAspectRatio="none">
  <!-- A stroke of a yellow marker for the tags page (see .tags h2 in assets/css/main.scss).
       It is stretched to the heading line, so the shapes are drawn wide and low. -->
  <defs>
    <!-- Soft at the start, lighter in the middle, darker where the stroke ends. -->
    <linearGradient id="ink">
      <stop offset="0" stop-color="#ffe600" stop-opacity="0.3"/>
      <stop offset="0.03" stop-color="#ffe600" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffe600" stop-opacity="0.3"/>
      <stop offset="0.88" stop-color="#ffde00" stop-opacity="0.5"/>
      <stop offset="0.97" stop-color="#fad200" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fad200" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Streaks of the felt tip: they come in after the start and get stronger to the end. -->
    <linearGradient id="streak">
      <stop offset="0.03" stop-color="#f5c800" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#f5c800" stop-opacity="0.18"/>
      <stop offset="0.9" stop-color="#f5c800" stop-opacity="0.3"/>
      <stop offset="0.99" stop-color="#f5c800" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Wavy top and bottom edges, a rough start and a slanted end where the tip lifts. -->
  <path fill="url(#ink)" d="
    M4 3
    C30 1 55 4 85 2.5 S140 0.5 175 3 S245 4 280 1 S352 3 393 0.5
    C397 6 399 18 397 28 C396 33 394 36 391 38
    C360 35 330 39 295 37 S220 34 185 38 S110 39 75 36 S28 38 6 37
    C2 30 0 22 1 12 C1 8 2 5 4 3 Z"/>
  <path fill="none" stroke="url(#streak)" stroke-width="1.6" stroke-linecap="round"
    d="M12 11 C70 9 120 12 190 10 S320 8 392 7"/>
  <path fill="none" stroke="url(#streak)" stroke-width="1.2" stroke-linecap="round"
    d="M18 31 C90 32 150 30 220 32 S330 33 388 31"/>
</svg>
