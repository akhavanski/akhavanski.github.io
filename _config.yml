title: Aliaksei Khavanski # name of the site
author: Aliaksei Khavanski # name of site's author
email: aliakseichowanski@gmail.com # email of site's author
contact_email: aliakseichowanski@gmail.com # public address for readers (header icon, post footer)
url: https://akh.cx # root address of the site
baseurl: "" # subpath of the site, e.g. "/blog" (leave it blank "" if you're site shouldn't use a subpath)

permalink: /:year-:month-:day-:slug.html

favicon: "favicon.ico" # name+extension of favicon (which must be put on the root folder)

goat_counter: "akh" # GoatCounter analytics: akh.goatcounter.com

# A small turtle peeking out from under the bottom edge of the window
# (see _includes/turtle.html): `show: true` turns it on,
# `text` is what it says in a bubble on click (Markdown).
turtle:
  show: false
  text: "Hi! You found the turtle."

remote_theme: riggraz/no-style-please

theme_config:
  appearance: "light" # can be "light", "dark" or "auto"
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: false # show blog description in home page
  lowercase_titles: false # show titles in lowercase in lists

# Posts are in English unless a post says otherwise, e.g. `lang: ru`.
defaults:
  - scope:
      type: posts
    values:
      lang: en

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-remote-theme

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - CLAUDE.md
