---
layout: default
---

{%-include header.html-%}

<article>
  <h1>{{ page.title }}</h1>

  {{ content }}
</article>

<p class="post-footer">— {{ site.author | split: " " | first }}, <time datetime="{{ page.date }}">{{ page.date | date: site.theme_config.date_format }}</time>. If you don’t agree or think I made a mistake, drop me an <a href="mailto:{{ site.contact_email }}">email</a>.</p>
